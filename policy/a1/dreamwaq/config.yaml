a1/dreamwaq:
  # 单帧观测 45 维 = [ang_vel(3), gravity_vec(3), commands(3), dof_pos(12), dof_vel(12), actions(12)]
  # 5 帧历史经 encoder 估计 code(19) = [vel(3), latent(16)]（vel 在前）。
  # actor 输入 = [code(19), obs(45)] = 64，输出 12 维动作。
  # 多模型管线：history(225) -> encoder(->64) -> {vel_mu(->3), latent_mu(->16)} -> actor -> 12
  # 注：需补充 encoder_dwaq.pt（225->64），当前目录仅有 actor/latent_mu/vel_mu。
  decimation: 4
  models:
    - name: encoder
      file: encoder_dwaq.pt
      inputs: [obs]                        # 展平的 5 帧历史 = 225
      output: enc
    - name: vel
      file: vel_mu_dwaq.pt
      inputs: [enc]
      output: vel                          # 3
    - name: latent
      file: latent_mu_dwaq.pt
      inputs: [enc]
      output: latent                       # 16
    - name: actor
      file: actor_dwaq.pt
      # 模型 forward 只接受一个 tensor，用 concat 拼成 [vel(3), latent(16), 最新单帧 obs(45)] = 64
      inputs: ["concat(vel, latent, obs[180:225])"]
      output: action                       # 12
      action: true
  observations: ["ang_vel", "gravity_vec", "commands", "dof_pos", "dof_vel", "actions"]
  observations_dims_list: [3, 3, 3, 12, 12, 12]
  observations_history: [4, 3, 2, 1, 0]
  observations_history_priority: time
  num_policy_observations: 225

  clip_obs: 100.0
  clip_actions:
    lower: [-100.0, -100.0, -100.0,
            -100.0, -100.0, -100.0,
            -100.0, -100.0, -100.0,
            -100.0, -100.0, -100.0,
            -100.0, -100.0, -100.0]
    upper: [ 100.0, 100.0, 100.0,
             100.0, 100.0, 100.0,
             100.0, 100.0, 100.0,
             100.0, 100.0, 100.0]
  rl_kp: [20.0, 20.0, 20.0,
          20.0, 20.0, 20.0,
          20.0, 20.0, 20.0,
          20.0, 20.0, 20.0]
  rl_kd: [0.5, 0.5, 0.5,
          0.5, 0.5, 0.5,
          0.5, 0.5, 0.5,
          0.5, 0.5, 0.5]
  fixed_kp: [80.0, 80.0, 80.0,
             80.0, 80.0, 80.0,
             80.0, 80.0, 80.0,
             80.0, 80.0, 80.0]
  fixed_kd: [3.0, 3.0, 3.0,
             3.0, 3.0, 3.0,
             3.0, 3.0, 3.0,
             3.0, 3.0, 3.0]
  lin_vel_scale: 2.0
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  commands_scale: [1.0, 1.0, 0.25]
  action_scale: [0.25, 0.25, 0.25,
                 0.25, 0.25, 0.25,
                 0.25, 0.25, 0.25,
                 0.25, 0.25, 0.25]
  # 策略关节顺序：FL, FR, RL, RR（对应 joint_mapping 的目标关节）
  default_dof_pos: [ 0.1000, 0.8000, -1.5000,
                    -0.1000, 0.8000, -1.5000,
                     0.1000, 1.0000, -1.5000,
                    -0.1000, 1.0000, -1.5000]
  num_of_dofs: 12
  joint_mapping: [3, 4, 5, 0, 1, 2, 9, 10, 11, 6, 7, 8]
  torque_limits: [33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5]